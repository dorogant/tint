[package]
name = "floe-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Floe playback core: a thin C ABI over librespot"

[lib]
crate-type = ["staticlib"]

# librespot is pinned to a commit on `dev`, not the 0.8.0 crates.io release:
# 0.8.0 does not build from crates.io (librespot-org/librespot#1760, vergen
# mismatch), and `dev` carries ~11 months of playback fixes. Bump the rev on
# purpose, never implicitly; all librespot crates must share it.
[dependencies.librespot-core]
git = "https://github.com/librespot-org/librespot"
rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d"
default-features = false
features = ["native-tls"]

[dependencies.librespot-playback]
git = "https://github.com/librespot-org/librespot"
rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d"
default-features = false # no rodio/cpal: audio goes to Swift through our own Sink
features = ["native-tls"]

[dependencies.librespot-metadata]
git = "https://github.com/librespot-org/librespot"
rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d"
default-features = false
features = ["native-tls"]

[dependencies.librespot-protocol] # only for the AuthenticationType enum
git = "https://github.com/librespot-org/librespot"
rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d"

[dependencies]
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rtrb = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[profile.release]
lto = true
codegen-units = 1
debug = false
